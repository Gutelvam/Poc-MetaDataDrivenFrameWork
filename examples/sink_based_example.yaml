# Complex aggregation example
dag_id: "aggregation_pipeline_sink_based"
description: "Complex aggregation pipeline using sink-based approach"
pipeline_type: "batch"
schedule_interval: "0 6 * * *"
start_date: "2024-01-01"

tasks:
  - task_id: "extract_sales"
    operator_type: "extract"
    description: "Extract daily sales data"
    source:
      name: "sales_source"
      type: "postgresql"
      connection_id: "postgres_conn"
      query: |
        SELECT 
          sale_id, product_id, customer_id, sale_date, 
          quantity, unit_price, total_amount, region
        FROM sales 
        WHERE sale_date = current_date
    auto_sink: true

  - task_id: "extract_products"
    operator_type: "extract"
    description: "Extract product information"
    source:
      name: "products_source"
      type: "postgresql"
      connection_id: "postgres_conn"
      query: "SELECT product_id, product_name, category, brand FROM products"
    auto_sink: true

  - task_id: "join_sales_products"
    operator_type: "transform"
    description: "Join sales with product information"
    depends_on: ["extract_sales", "extract_products"]
    source_task_ids: ["extract_sales", "extract_products"]
    sql_transform: |
      SELECT 
        s.sale_id,
        s.customer_id,
        s.sale_date,
        s.quantity,
        s.unit_price,
        s.total_amount,
        s.region,
        p.product_name,
        p.category,
        p.brand
      FROM extract_sales s
      LEFT JOIN extract_products p ON s.product_id = p.product_id
    auto_sink: true

  - task_id: "daily_aggregation"
    operator_type: "transform"
    description: "Aggregate daily sales by category and region"
    depends_on: ["join_sales_products"]
    source_task_ids: ["join_sales_products"]
    sql_transform: |
      SELECT 
        category,
        region,
        COUNT(*) as total_sales,
        SUM(quantity) as total_quantity,
        SUM(total_amount) as total_revenue,
        AVG(total_amount) as avg_sale_amount,
        current_date as processing_date
      FROM join_sales_products
      GROUP BY category, region
    auto_sink: true

  - task_id: "load_daily_summary"
    operator_type: "load"
    description: "Load aggregated results to reporting table"
    depends_on: ["daily_aggregation"]
    source_task_ids: ["daily_aggregation"]
    sink:
      name: "daily_summary_sink"
      type: "postgresql"
      connection_id: "postgres_conn"
      table_name: "daily_sales_summary"
      write_mode: "append"
      auto_create_table: true