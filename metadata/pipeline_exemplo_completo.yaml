  # Agregação por categoria (usando dados diretos)
  - task_id: agregar_por_categoria
    operator_type: transform
    description: "Agrega vendas por categoria"
    depends_on: [extrair_orders]
    python_transform: |
      # Or even better, this comprehensive version:
      def aggregate_by_category(datasets, **context):
          import pandas as pd
          from datetime import datetime
          
          orders = pd.DataFrame(datasets['extrair_orders'])
          
          if orders.empty:
              return []
          
          # Convert numeric columns safely
          for col in ['order_amount', 'discount_amount', 'tax_amount']:
              if col in orders.columns:
                  orders[col] = pd.to_numeric(orders[col], errors='coerce').fillna(0.0)
          
          # Aggregation by category
          category_summary = orders.groupby('product_category').agg({
              'order_amount': ['sum', 'mean', 'count'],
              'discount_amount': 'sum',
              'tax_amount': 'sum'
          }).round(2)
          
          # Flatten columns
          category_summary.columns = ['_'.join(col).strip() for col in category_summary.columns]
          category_summary = category_summary.reset_index()
          
          # SAFE context access - this is the key fix
          processing_date = context.get('ds')
          if not processing_date:
              execution_date = context.get('execution_date')
              if execution_date:
                  processing_date = execution_date.strftime('%Y-%m-%d')
              else:
                  processing_date = datetime.now().strftime('%Y-%m-%d')
          
          category_summary['processing_date'] = processing_date
          category_summary['total_categories'] = len(category_summary)
          
          return category_summary.to_dict('records')

  # Validação e limpeza usando Python (mais confiável)
  - task_id: validar_e_limpar
    operator_type: transform
    description: "Valida e limpa os dados transformados"
    depends_on: [transformar_customer_summary_v2]
    python_transform: |
      def validate_and_clean(datasets, **context):
          import pandas as pd
          
          data = pd.DataFrame(datasets['transformar_customer_summary_v2'])
          
          if data.empty:
              return []
          
          # Remover duplicatas
          data = data.drop_duplicates(subset=['customer_id'])
          
          # Validar email
          data = data[data['email'].notna()]
          data = data[data['email'].str.contains('@', na=False)]
          
          # Limpar valores monetários
          data['total_spent_today'] = data['total_spent_today'].fillna(0)
          data['avg_order_value'] = data['avg_order_value'].fillna(0)
          
          # Validar ranges
          data = data[data['total_spent_today'] >= 0]
          data = data[data['total_spent_today'] <= 50000]
          
          return data.to_dict('records')

  # Carregamento para o data warehouse
  - task_id: carregar_customer_summary
    operator_type: load
    description: "Carrega resumo de clientes no DW"
    depends_on: [validar_e_limpar]
    sink:
      name: customer_summary_dw
      type: postgresql
      connection_id: postgres_dev
      schema_name: public
      table_name: customer_daily_summary
      write_mode: upsert
      upsert_keys: [customer_id, processing_date]
      auto_create_table: true
      table_schema:
        customer_id: INTEGER
        full_name: VARCHAR(255)
        email: VARCHAR(255)
        customer_segment: VARCHAR(50)
        country: VARCHAR(50)
        city: VARCHAR(100)
        age: INTEGER
        registration_date: DATE
        orders_count: INTEGER
        total_spent_today: DECIMAL(12,2)
        avg_order_value: DECIMAL(10,2)
        processing_date: DATE
        processed_at: TIMESTAMP
      batch_size: 1000

  # Carregamento das agregações
  - task_id: carregar_category_summary
    operator_type: load
    description: "Carrega agregações por categoria"
    depends_on: [agregar_por_categoria]
    sink:
      name: category_summary_dw
      type: postgresql
      connection_id: postgres_dev
      schema_name: public
      table_name: category_daily_summary
      write_mode: append
      auto_create_table: true
      batch_size: 100

  # Geração de relatório de qualidade
  - task_id: relatorio_qualidade
    operator_type: quality_check
    description: "Gera relatório final de qualidade"
    depends_on: [validar_e_limpar]  # ✅ This returns actual data
    quality_rules:
      - name: check_completeness
        rule_type: completeness
        threshold: 0.95
        severity: warning

  # Notificação de sucesso
  - task_id: notificar_sucesso
    operator_type: custom
    description: "Notifica sucesso do pipeline"
    depends_on: [carregar_customer_summary, carregar_category_summary, relatorio_qualidade]
    custom_function: |
      def notify_success(**context):
          import logging
          logger = logging.getLogger(__name__)
          
          dag_id = context['dag'].dag_id
          execution_date = context['execution_date']
          
          logger.info(f"Pipeline {dag_id} executado com sucesso em {execution_date}")
          
          return {
              "status": "success",
              "dag_id": dag_id,
              "execution_date": execution_date.isoformat(),
              "message": "Pipeline concluído com sucesso"
          }
    
  # Tarefa final
  - task_id: fim
    operator_type: dummy
    description: "Fim do pipeline"
    depends_on: [notificar_sucesso]

# Configurações de SLA e monitoramento
sla: 120  # 2 horas
retries: 2
retry_delay: 600  # 10 minutos

# Configurações de reprocessamento
allow_reprocessing: true
reprocess_lookback_days: 7