# Example: Sink-Based Data Sharing Pipeline
# This example shows the new production-ready approach that replaces XCom with configurable sinks
# Each task automatically creates a sink (default: temp database) that other tasks can query
# Compatible with Airflow 3.x templating

dag_id: "order_processing_sink_based"
description: "Order processing pipeline using sink-based data sharing instead of XCom"
pipeline_type: "batch"
schedule_interval: "0 2 * * *"
start_date: "2024-01-01"
catchup: false
owner: "data-team"
tags: ["orders", "sink-based", "production"]

tasks:
  # Step 1: Extract orders data
  - task_id: "extract_orders"
    operator_type: "extract"
    description: "Extract orders from database"
    source:
      name: "orders_source"
      type: "postgresql"
      connection_id: "postgres_dev"
      query: "SELECT * FROM public.orders "
    # NEW: Automatic sink configuration
    auto_sink: true
    auto_sink_type: "temp_database"  # Data will be available as table 'extract_orders'

  # Step 2: Transform - Your "birds" example
  - task_id: "count_orders"
    operator_type: "transform"
    description: "SELECT count(*) from orders"
    depends_on: ["extract_orders"]
    # NEW: Source task IDs instead of XCom pulls
    source_task_ids: ["extract_orders"]
    sql_transform: |
      SELECT count(*) as total from extract_orders
    # Data automatically sinks to temp database as table 'birds'
    auto_sink: true
    auto_sink_type: "temp_database"

  # Step 3: Second transform - Your example query
  - task_id: "distinct_analysis"
    operator_type: "transform"
    description: "Query distinct values from previous step (your example: SELECT DISTINCT(1) FROM birds)"
    depends_on: ["count_orders"]
    # NEW: Query from previous task's sink instead of XCom
    source_task_ids: ["count_orders"]
    sql_transform: |
      SELECT 'orders' as Orders,* 
      FROM count_orders
    auto_sink: true
    auto_sink_type: "temp_database"

  # Step 4: Load results to final destination
  - task_id: "load_results"
    operator_type: "load"
    description: "Load processed data to final table"
    depends_on: ["distinct_analysis"]
    source_task_ids: ["distinct_analysis"]
    sink:
      name: "results_sink"
      type: "postgresql"
      connection_id: "postgres_dev"
      table_name: "order_analysis_results"
      write_mode: "overwrite"
      auto_create_table: true

  # # Step 5: API notification task with no sink (procedure example)
  # - task_id: "notify_api"
  #   operator_type: "custom"
