# monitoring/prometheus/prometheus.yml
# Fixed Prometheus configuration for Airflow Framework monitoring

global:
  scrape_interval: 15s
  
rule_files:
  - "airflow_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []


scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Main job: Scrape Airflow metrics from StatsD exporter  
  - job_name: 'airflow_metrics'
    static_configs:
      - targets: ['prometheus-statsd:9102']
    metrics_path: '/metrics'
    scrape_interval: 15s