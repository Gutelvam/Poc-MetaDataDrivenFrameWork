# Define o bloco de dependências comuns para ser reutilizado
x-airflow-deps: &airflow-common-deps
  postgres:
    condition: service_healthy

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__API__SECRET_KEY: 'framework_secret_key_change_in_production'
    
    # Fixed Airflow 3.x authentication settings
    AIRFLOW__WEBSERVER__AUTHENTICATE: 'true'
    AIRFLOW__WEBSERVER__AUTH_BACKEND: 'airflow.auth.backends.password_auth'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__WEBSERVER__RBAC: 'true'
    
    # Framework specific
    FRAMEWORK_METADATA_PATH: /opt/airflow/metadata
    PYTHONPATH: /opt/airflow/dags:/opt/airflow
    COMPOSE_CONVERT_WINDOWS_PATHS: 1
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/metadata:/opt/airflow/metadata
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: *airflow-common-deps

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    ports:
      - "5432:5432"

  postgres-dev:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_database
    volumes:
      - postgres-dev-volume:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always

  redis:
    image: redis:7-alpine
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  # Fixed webserver with correct health check
  airflow-webserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/airflow/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-deps
      airflow-init:
        condition: service_completed_successfully

  # AIRFLOW 3.x SCHEDULER
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-deps
      airflow-init:
        condition: service_completed_successfully

  # AIRFLOW 3.x TRIGGERER
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-deps
      airflow-init:
        condition: service_completed_successfully

  # Fixed initialization for Airflow 3.x
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "🚀 Inicializando Framework com Airflow 3.x..."
        echo "=============================================="
        
        echo "⏳ Aguardando PostgreSQL..."
        while ! pg_isready -h postgres -U airflow -d airflow; do
          echo "   Aguardando conexão com o banco..."
          sleep 2
        done
        echo "✅ PostgreSQL pronto"
        
        echo "🗄️  Inicializando banco de dados do Airflow..."
        airflow db migrate
        
        if [ $? -eq 0 ]; then
            echo "✅ Banco de dados inicializado com sucesso"
        else
            echo "❌ Falha na inicialização do banco"
            exit 1
        fi
        
        echo "👤 Criando usuário admin..."
        # Fixed user creation command for Airflow 3.x
        airflow users create --username admin --firstname Framework --lastname Admin --role Admin --email admin@framework.com --password admin || echo "⚠️ Usuário já existe ou erro na criação"
        
        echo "📁 Criando estrutura de diretórios..."
        mkdir -p /sources/logs /sources/dags /sources/plugins /sources/metadata /sources/config
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins,metadata,config}
        
        echo ""
        echo "🎉 Inicialização concluída com sucesso!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🌐 Acesse: http://localhost:8080"
        echo "👤 Login: admin / admin"
        echo "📖 Airflow 3.x - Webserver + Scheduler + Triggerer"
        echo "⚡ Sua arquitetura original mantida!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    environment:
      <<: *airflow-common-env
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
      GF_LIVE_STREAM_ENABLED: true
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped



