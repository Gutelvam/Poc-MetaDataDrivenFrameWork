x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__API__SECRET_KEY: 'framework_secret_key_change_in_production'
    FRAMEWORK_METADATA_PATH: /opt/airflow/metadata
    PYTHONPATH: /opt/airflow/dags:/opt/airflow
    COMPOSE_CONVERT_WINDOWS_PATHS: 1
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/metadata:/opt/airflow/metadata
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    ports:
      - "5432:5432"

  postgres-dev:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_database
    volumes:
      - postgres-dev-volume:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always

  # Airflow 3.x Standalone Mode (includes webserver, scheduler, everything)
  airflow-standalone:
    <<: *airflow-common
    command: standalone
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "🚀 Inicializando Framework com Airflow 3.x..."
        echo "=============================================="
        
        echo "⏳ Aguardando PostgreSQL..."
        while ! pg_isready -h postgres -U airflow -d airflow; do
          echo "   Aguardando conexão com o banco..."
          sleep 2
        done
        echo "✅ PostgreSQL pronto"
        
        echo "🗄️  Inicializando banco de dados do Airflow..."
        airflow db migrate
        
        if [ $? -eq 0 ]; then
            echo "✅ Banco de dados migrado com sucesso"
        else
            echo "❌ Falha na migração do banco"
            exit 1
        fi
        
        echo "📁 Criando estrutura de diretórios..."
        mkdir -p /sources/logs /sources/dags /sources/plugins /sources/metadata /sources/config
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins,metadata,config}
        
        echo ""
        echo "🎉 Inicialização concluída com sucesso!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🌐 Acesse: http://localhost:8080"
        echo "📖 Airflow 3.x Standalone Mode"
        echo "👤 Standalone criará usuário automaticamente"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

